services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alwaha_parts
      POSTGRES_USER: alwaha
      POSTGRES_PASSWORD: alwaha_dev
    ports: ['5432:5432']
    volumes: [alwaha-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alwaha -d alwaha_parts']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  alwaha-postgres:
